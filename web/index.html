<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador BDE</title>
<meta name="description" content="Simulador não oficial do Bônus de Desempenho Educacional (BDE) da rede estadual de Pernambuco.">
<style>
  :root {
    --azul: #1d4ed8;
    --teal: #0d9488;
    --verde: #059669;
    --ambar: #b45309;
    --tinta: #0f172a;
    --tinta-fraca: #475569;
    --borda: #d8dee9;
    --fundo: #f4f6fb;
    --papel: #ffffff;
    --erro: #b91c1c;
    --raio: 12px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--fundo);
    color: var(--tinta);
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }

  .app {
    max-width: 680px;
    margin: 0 auto;
    padding: 20px 16px 32px;
  }

  /* ---------- Cabeçalho ---------- */

  .cabecalho { margin-bottom: 18px; }

  .cabecalho h1 {
    margin: 0 0 4px;
    font-size: 1.35rem;
    letter-spacing: -0.01em;
  }

  .cabecalho p {
    margin: 0;
    font-size: 0.875rem;
    color: var(--tinta-fraca);
  }

  /* ---------- Barra de progresso ----------
     O degradê ocupa a trilha inteira e quem anda é o recorte (clip-path), não
     a largura do elemento pintado. Animar a largura encolheria o degradê
     junto: nas primeiras etapas a barra mostraria só o início da escala e
     pareceria de cor única — e em tela estreita pareceria assim até o fim. */

  .progresso { margin-bottom: 22px; }

  .progresso-trilha {
    height: 8px;
    border-radius: 999px;
    background: #e2e8f0;
    overflow: hidden;
  }

  .progresso-preenchimento {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #4f46e5 0%, var(--azul) 28%, var(--teal) 62%, var(--verde) 100%);
    clip-path: inset(0 100% 0 0);
    transition: clip-path 320ms ease;
  }

  .progresso-rotulo {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 8px;
    font-size: 0.8125rem;
    color: var(--tinta-fraca);
  }

  .progresso-rotulo strong { color: var(--tinta); font-weight: 600; }

  /* ---------- Cartão ---------- */

  .cartao {
    background: var(--papel);
    border: 1px solid var(--borda);
    border-radius: var(--raio);
    padding: 20px;
  }

  .cartao h2 {
    margin: 0 0 6px;
    font-size: 1.0625rem;
  }

  .ajuda {
    margin: 0 0 18px;
    font-size: 0.875rem;
    color: var(--tinta-fraca);
  }

  /* ---------- Campos ---------- */

  .campo { margin-bottom: 16px; }

  .campo label {
    display: block;
    font-size: 0.875rem;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .campo .dica {
    display: block;
    font-size: 0.8125rem;
    font-weight: 400;
    color: var(--tinta-fraca);
    margin-bottom: 6px;
  }

  .campo input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 1rem;
    font-family: inherit;
    color: inherit;
    background: var(--papel);
    border: 1px solid var(--borda);
    border-radius: 8px;
  }

  .campo input[type="text"]:focus {
    outline: 2px solid var(--azul);
    outline-offset: -1px;
    border-color: var(--azul);
  }

  .campo.invalido input[type="text"] { border-color: var(--erro); }

  .erro {
    display: block;
    margin-top: 5px;
    font-size: 0.8125rem;
    color: var(--erro);
  }

  .dupla { display: flex; gap: 12px; }
  .dupla .campo { flex: 1; margin-bottom: 16px; }

  /* ---------- Opções (checkbox / sim-não) ---------- */

  .opcao {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 12px;
    margin-bottom: 10px;
    border: 1px solid var(--borda);
    border-radius: 8px;
    cursor: pointer;
  }

  .opcao:hover { border-color: var(--azul); }
  .opcao input { margin: 3px 0 0; flex: none; width: 18px; height: 18px; accent-color: var(--azul); }
  .opcao .texto { font-size: 0.9375rem; }
  .opcao .texto small { display: block; color: var(--tinta-fraca); font-size: 0.8125rem; }

  /* ---------- Prévia da diferença (caminho ruim A3) ---------- */

  .previa {
    margin-top: 4px;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px dashed var(--borda);
    font-size: 0.875rem;
    color: var(--tinta-fraca);
  }

  .previa.acima { border-color: var(--verde); border-style: solid; background: #ecfdf5; color: #065f46; }
  .previa.abaixo { border-color: var(--ambar); border-style: solid; background: #fffbeb; color: #7c4a03; }
  .previa strong { font-weight: 700; }

  /* ---------- Navegação ---------- */

  .navegacao {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  button {
    font: inherit;
    font-weight: 600;
    padding: 11px 20px;
    border-radius: 8px;
    border: 1px solid transparent;
    cursor: pointer;
  }

  .primario { background: var(--azul); color: #fff; flex: 1; }
  .primario:hover { background: #1740b8; }
  .secundario { background: var(--papel); color: var(--tinta); border-color: var(--borda); }
  .secundario:hover { border-color: var(--tinta-fraca); }
  button:focus-visible { outline: 2px solid var(--tinta); outline-offset: 2px; }

  /* ---------- Resultado ---------- */

  .placar {
    text-align: center;
    padding: 22px 16px;
    border-radius: var(--raio);
    background: linear-gradient(135deg, #1e3a8a 0%, #0f766e 100%);
    color: #fff;
    margin-bottom: 18px;
  }

  .placar .valor { font-size: 3rem; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
  .placar .legenda { font-size: 0.875rem; opacity: 0.88; margin-top: 6px; }

  .placar.inapto { background: linear-gradient(135deg, #7f1d1d 0%, #b45309 100%); }

  .cotas { border-collapse: collapse; width: 100%; font-size: 0.875rem; margin-bottom: 18px; }
  .cotas th, .cotas td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--borda); }
  .cotas td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .cotas tr:last-child td { border-bottom: none; }
  .cotas .celula-fraca { color: var(--tinta-fraca); font-weight: 400; }

  .bloco { margin-bottom: 18px; }
  .bloco h3 { font-size: 0.9375rem; margin: 0 0 8px; }

  .lista { margin: 0; padding-left: 18px; font-size: 0.875rem; }
  .lista li { margin-bottom: 5px; }

  .memoria {
    margin: 0;
    padding: 12px 14px;
    background: #f8fafc;
    border: 1px solid var(--borda);
    border-radius: 8px;
    font-size: 0.8125rem;
    line-height: 1.7;
    list-style: none;
  }

  .memoria li + li { margin-top: 2px; }

  .alerta {
    padding: 11px 13px;
    border-left: 3px solid var(--ambar);
    background: #fffbeb;
    border-radius: 0 6px 6px 0;
    font-size: 0.875rem;
    margin-bottom: 8px;
  }

  .aviso-legal {
    font-size: 0.8125rem;
    color: var(--tinta-fraca);
    border-top: 1px solid var(--borda);
    padding-top: 12px;
    margin: 18px 0 0;
  }

  @media (max-width: 460px) {
    .dupla { flex-direction: column; gap: 0; }
    .placar .valor { font-size: 2.5rem; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="cabecalho">
    <h1>Simulador do BDE</h1>
    <p>Bônus de Desempenho Educacional &middot; rede estadual de Pernambuco &middot; base IDEPE/SAEPE 2025</p>
  </header>

  <div class="progresso">
    <div class="progresso-trilha">
      <div class="progresso-preenchimento" id="progresso-preenchimento"></div>
    </div>
    <div class="progresso-rotulo">
      <span id="progresso-titulo">&nbsp;</span>
      <span id="progresso-contagem">&nbsp;</span>
    </div>
  </div>

  <main class="cartao" id="palco"></main>

</div>

<script>
"use strict";

/* =====================================================================
   MOTOR — porte de src/bde/service.py para o navegador.

   Cadeia de cálculo, na ordem da planilha:

     B21/B29/B37  diferença por etapa = resultado − meta (sem arredondar)
     H47          média ponderada pelas matrículas, ROUND(...; 4)
     H45          conversão da média em percentual de atingimento
     B40 / B41    cota resultado = min(H45; 1) / cota além = H45 − B40
     B42 / B43    cotas de equidade e de elementares
     B44          cota de participação
     C45          cota total do BDE

   Divergências conhecidas da planilha em relação à regra escrita,
   reproduzidas por decisão de negócio:

     - As cotas de equidade e elementares não são cumulativas: C45 usa OR.
     - H45 devolve 0% para diferenças entre −0,3 e −0,2.

   Detalhes e tabela-verdade em docs/EXTRACAO_PLANILHA.md.
   ===================================================================== */

var COTA_EQUIDADE = 1.0;
var COTA_ELEMENTARES = 1.0;
var COTA_PARTICIPACAO = 0.5;

var TETO_BDE = 3.0;

var MATRICULAS_MIN = 8;
var MATRICULAS_MAX = 50000;
var IDEPE_MIN = 1.5;
var IDEPE_MAX = 9.2;

var LIMITES_FAIXAS = [-0.3, -0.2, -0.1, 0.0, 0.1, 0.2, 0.3, 0.4];
var MARGEM_ALERTA = 0.01;

var AVISO_LEGAL =
  "Simulação não oficial. Desenvolvida para esclarecer dúvidas sobre o " +
  "atingimento das metas; pequenas diferenças podem ocorrer por " +
  "arredondamento. O valor final do BDE depende ainda de salário-base, " +
  "cargo e tempo de vínculo, que não entram nesta simulação.";

/**
 * ROUND(valor; 4) do Excel — empate vai para longe do zero.
 *
 * Math.round sozinho arredonda meio-para-cima (em direção a +∞), o que erra o
 * sinal nos negativos; por isso o cálculo roda no valor absoluto. O
 * toPrecision(12) descarta o resíduo binário da multiplicação: sem ele
 * 0,09995 × 10⁴ vira 999,4999999999999 e cai na faixa de 100% em vez de 125%.
 */
function arredondarExcel(valor) {
  var sinal = valor < 0 ? -1 : 1;
  var escalado = Number((Math.abs(valor) * 1e4).toPrecision(12));
  return (sinal * Math.round(escalado)) / 1e4;
}

/**
 * Fórmula H45. Recebe a diferença já arredondada por arredondarExcel.
 *
 * A ordem dos testes reproduz a escada de IFs da planilha, inclusive o trecho
 * em que ela devolve 0 em vez de ler 0,25 da grade E42:M43.
 */
function converterDiferencaEmPercentual(diferenca) {
  if (diferenca < -0.3) return 0.00;
  if (diferenca === -0.3) return 0.25;  // única diferença que rende 25% em H45
  if (diferenca < -0.2) return 0.00;    // buraco de H45, reproduzido por decisão de negócio
  if (diferenca < -0.1) return 0.50;
  if (diferenca < 0.0) return 0.75;
  if (diferenca < 0.1) return 1.00;
  if (diferenca < 0.2) return 1.25;
  if (diferenca < 0.3) return 1.50;
  if (diferenca < 0.4) return 1.75;
  return 2.00;
}

/**
 * Fórmula C45, sem a parcela B44. Devolve a cota e o rótulo do ramo aplicado.
 *
 * Forma reduzida de 3 ramos. O 3º ramo da planilha é inalcançável (B40 é
 * min(H45; 1), logo B40<=1 é sempre verdadeiro) e também redundante: quando
 * valeria, devolveria 2, o mesmo que 1+B40 com B40=1.
 */
function calcularCotaBde(percentualIdepe, temEquidade, temElementares) {
  var cotaResultado = Math.min(percentualIdepe, 1.0);            // B40
  var cotaAlem = Math.max(percentualIdepe - cotaResultado, 0.0); // B41

  if (cotaResultado === 1.0 && cotaAlem === 1.0 && temEquidade && temElementares) {
    return { cota: 2.5, ramo: "atingimento de 200% com as duas metas de equidade" };
  }
  if (temEquidade || temElementares) {
    return { cota: 1.0 + cotaResultado, ramo: "cota de resultado + 100% por meta de equidade" };
  }
  return { cota: cotaResultado, ramo: "apenas a cota de resultado, sem metas de equidade" };
}

/** Traduz os platôs da fórmula em orientação para o gestor. */
function gerarAlertas(d) {
  var alertas = [];

  if (d.mediaPonderada > -0.3 && d.mediaPonderada < -0.2) {
    alertas.push(
      "Sua média ponderada ficou entre −0,30 e −0,20. Nessa faixa a cota de " +
      "resultado fica em 0%: apenas a diferença exatamente igual a −0,30 recebe " +
      "25%. Confirme o resultado com a sua GRE."
    );
  }

  var proximos = LIMITES_FAIXAS.filter(function (limite) { return limite > d.mediaPonderada; });
  if (proximos.length > 0) {
    var proximo = proximos[0];
    var falta = proximo - d.mediaPonderada;
    if (falta < MARGEM_ALERTA) {
      var ganho = converterDiferencaEmPercentual(proximo);
      alertas.push(
        "Faltaram " + numero(falta, 4) + " ponto(s) na média ponderada para " +
        "alcançar a diferença de " + comSinal(proximo, 1) + ", que elevaria o " +
        "atingimento do IDEPE para " + percentual(ganho) + "."
      );
    }
  }

  var noTetoAbsoluto = d.percentualIdepe === 2.0 && d.temEquidade && d.temElementares;
  if (d.percentualIdepe > 1.0 && !noTetoAbsoluto) {
    alertas.push(
      "Sua cota de resultado já está no teto de 100%. Superar ainda mais a meta " +
      "só aumenta o BDE se o atingimento chegar a 200% (diferença de +0,40 ou " +
      "mais) e as duas metas de equidade forem atingidas."
    );
  }

  if (!d.temEquidade && !d.temElementares) {
    alertas.push(
      "Atingir qualquer uma das duas metas de equidade elevaria a cota do BDE " +
      "em 100 pontos percentuais."
    );
  } else if (d.temEquidade !== d.temElementares) {
    if (d.percentualIdepe === 2.0) {
      alertas.push(
        "Atingir também a outra meta de equidade elevaria a cota do BDE em 50 " +
        "pontos percentuais."
      );
    } else {
      alertas.push(
        "A segunda meta de equidade não altera a cota nesta faixa de " +
        "atingimento: as duas juntas só valem mais que uma isolada quando o " +
        "atingimento do IDEPE chega a 200%."
      );
    }
  } else if (d.percentualIdepe < 2.0) {
    alertas.push(
      "As duas metas de equidade juntas valem o mesmo que uma isolada nesta " +
      "faixa de atingimento, porque a fórmula não as soma."
    );
  }

  if (!d.temParticipacao) {
    alertas.push(
      "Participação igual ou superior a 80% em todos os componentes e etapas do " +
      "SAEPE acrescentaria 50 pontos percentuais."
    );
  }

  if (d.percentualBde < TETO_BDE && d.temParticipacao && (d.temEquidade || d.temElementares)) {
    alertas.push(
      "O teto de 300% exige, simultaneamente: atingimento do IDEPE de 200%, as " +
      "duas metas de equidade e participação de pelo menos 80%."
    );
  }

  return alertas;
}

/**
 * Calcula a cota do BDE a partir das respostas acumuladas do wizard.
 *
 * `etapas` é uma lista de { etapa, nome, matriculas, meta, resultado }. Uma
 * etapa não pactuada simplesmente não entra na lista: informar matrícula sem
 * meta faria a etapa entrar no denominador de H47 com diferença zero,
 * diluindo o resultado sem aviso.
 */
function calcularBde(requisicao) {
  if (requisicao.etapas.length === 0) {
    throw new Error(
      "Informe ao menos uma etapa pactuada (Anos Iniciais, Anos Finais ou " +
      "Ensino Médio). Escola sem meta pactuada não é elegível ao BDE."
    );
  }

  var detalhes = requisicao.etapas.map(function (e) {
    // A diferença exibida é arredondada porque, numa escola de etapa única,
    // H47 reduz a ROUND(B21; 4) — é o número que o gestor vê na planilha.
    var diferenca = arredondarExcel(e.resultado - e.meta);
    return {
      etapa: e.etapa,
      nome: e.nome,
      matriculas: e.matriculas,
      meta: e.meta,
      resultado: e.resultado,
      diferenca: diferenca,
      atingiuMeta: diferenca >= 0,
      percentualAtingimento: converterDiferencaEmPercentual(diferenca)
    };
  });

  // H47 — a planilha pondera as diferenças CRUAS e arredonda só o quociente.
  var totalMatriculas = requisicao.etapas.reduce(function (soma, e) {
    return soma + e.matriculas;
  }, 0);
  var somaPonderada = requisicao.etapas.reduce(function (soma, e) {
    return soma + (e.resultado - e.meta) * e.matriculas;
  }, 0);
  var mediaPonderada = arredondarExcel(somaPonderada / totalMatriculas);

  // H45 → B40 / B41
  var percentualIdepe = converterDiferencaEmPercentual(mediaPonderada);
  var cotaResultado = Math.min(percentualIdepe, 1.0);
  var cotaAlemResultado = Math.max(percentualIdepe - cotaResultado, 0.0);

  // B42 / B43 / B44
  var cotaEquidade = requisicao.reduziuDesigualdade ? COTA_EQUIDADE : 0.0;
  var cotaElementares = requisicao.tercoMenorElementares ? COTA_ELEMENTARES : 0.0;
  var cotaParticipacao = requisicao.participacaoMinimaAtingida ? COTA_PARTICIPACAO : 0.0;

  // C45
  var c45 = calcularCotaBde(
    percentualIdepe,
    requisicao.reduziuDesigualdade,
    requisicao.tercoMenorElementares
  );
  var percentualBde = c45.cota + cotaParticipacao;

  var memoria = detalhes.map(function (e) {
    return e.nome + ": " + numero(e.resultado, 2) + " − " + numero(e.meta, 2) +
      " = " + comSinal(e.diferenca, 4) + " (peso " + e.matriculas + " matrículas)";
  });

  memoria.push(
    "Média ponderada das diferenças (H47): " + comSinal(mediaPonderada, 4),
    "Atingimento do IDEPE (H45): " + percentual(percentualIdepe),
    "Cota resultado (B40): " + percentual(cotaResultado) +
      " · Cota além do resultado (B41): " + percentual(cotaAlemResultado),
    "Cota equidade (B42): " + percentual(cotaEquidade) +
      " · Cota elementares (B43): " + percentual(cotaElementares),
    "Cota do BDE (C45): " + percentual(c45.cota) + " — " + c45.ramo,
    "Cota participação (B44): +" + percentual(cotaParticipacao),
    "Cota total do BDE: " + percentual(percentualBde)
  );

  if (cotaAlemResultado > 0 && c45.cota !== 2.5) {
    memoria.push(
      "Observação: a cota além do resultado (" + percentual(cotaAlemResultado) +
      ") não entra neste total. A fórmula C45 só a considera quando o " +
      "atingimento é de 200% e as duas metas de equidade foram atingidas."
    );
  }

  return {
    percentualBde: percentualBde,
    percentualFormatado: percentual(percentualBde),
    aptoAReceber: percentualBde > 0.0,
    mediaPonderadaDiferenca: mediaPonderada,
    percentualIdepe: percentualIdepe,
    cotaResultado: cotaResultado,
    cotaAlemResultado: cotaAlemResultado,
    cotaEquidade: cotaEquidade,
    cotaElementares: cotaElementares,
    cotaParticipacao: cotaParticipacao,
    etapas: detalhes,
    memoriaCalculo: memoria,
    alertas: gerarAlertas({
      mediaPonderada: mediaPonderada,
      percentualIdepe: percentualIdepe,
      percentualBde: percentualBde,
      temEquidade: requisicao.reduziuDesigualdade,
      temElementares: requisicao.tercoMenorElementares,
      temParticipacao: requisicao.participacaoMinimaAtingida
    }),
    avisoLegal: AVISO_LEGAL
  };
}

/* ---------------------------------------------------------------------
   Formatação pt-BR
   --------------------------------------------------------------------- */

function numero(valor, casas) {
  return valor.toFixed(casas).replace("-", "−").replace(".", ",");
}

function comSinal(valor, casas) {
  var sinal = valor < 0 ? "−" : "+";
  return sinal + Math.abs(valor).toFixed(casas).replace(".", ",");
}

function percentual(fracao) {
  return Math.round(fracao * 100) + "%";
}

/**
 * Lê um decimal digitado em pt-BR. Devolve null quando o campo não contém um
 * número — a vírgula é o separador que o gestor usa, e rejeitá-la obrigaria a
 * explicar notação em vez de calcular bônus.
 */
function lerDecimal(texto) {
  var limpo = texto.trim().replace(",", ".");
  if (limpo === "") return null;
  var valor = Number(limpo);
  return Number.isFinite(valor) ? valor : null;
}

function lerInteiro(texto) {
  var limpo = texto.trim().replace(/[.\s]/g, "");
  if (limpo === "" || !/^\d+$/.test(limpo)) return null;
  return parseInt(limpo, 10);
}

/* =====================================================================
   WIZARD
   ===================================================================== */

var ETAPAS_DISPONIVEIS = [
  { id: "anos_iniciais", nome: "Anos Iniciais", detalhe: "Ensino Fundamental, 1º ao 5º ano" },
  { id: "anos_finais", nome: "Anos Finais", detalhe: "Ensino Fundamental, 6º ao 9º ano" },
  { id: "ensino_medio", nome: "Ensino Médio", detalhe: "1ª à 3ª série" }
];

var estado = {
  passo: 0,
  pactuadas: [],
  dados: {},          // id da etapa → { matriculas, meta, resultado }
  reduziuDesigualdade: null,
  tercoMenorElementares: null,
  participacaoMinimaAtingida: null
};

var palco = document.getElementById("palco");

/** Sequência de telas, recalculada porque depende das etapas pactuadas. */
function roteiro() {
  var telas = [{ tipo: "pactuadas", titulo: "Etapas pactuadas" }];
  estado.pactuadas.forEach(function (id) {
    var etapa = ETAPAS_DISPONIVEIS.find(function (e) { return e.id === id; });
    telas.push({ tipo: "etapa", id: id, titulo: etapa.nome });
  });
  telas.push({ tipo: "equidade", titulo: "Equidade e participação" });
  telas.push({ tipo: "resultado", titulo: "Resultado" });
  return telas;
}

function renderizar() {
  var telas = roteiro();
  var tela = telas[estado.passo];

  var preenchido = ((estado.passo + 1) / telas.length) * 100;
  document.getElementById("progresso-preenchimento").style.clipPath =
    "inset(0 " + (100 - preenchido) + "% 0 0)";
  document.getElementById("progresso-titulo").textContent = tela.titulo;
  document.getElementById("progresso-contagem").innerHTML =
    "Etapa <strong>" + (estado.passo + 1) + "</strong> de " + telas.length;

  if (tela.tipo === "pactuadas") telaPactuadas();
  else if (tela.tipo === "etapa") telaEtapa(tela.id);
  else if (tela.tipo === "equidade") telaEquidade();
  else telaResultado();

  palco.scrollIntoView({ block: "nearest" });
}

function avancar() { estado.passo += 1; renderizar(); }
function voltar() { estado.passo -= 1; renderizar(); }

/* ---------- Tela 1: etapas pactuadas ---------- */

function telaPactuadas() {
  palco.innerHTML =
    '<h2>Quais etapas a escola pactuou?</h2>' +
    '<p class="ajuda">Marque apenas as etapas com meta no Termo de Compromisso. ' +
    'Etapas sem meta não entram no cálculo — incluí-las diluiria a média ponderada.</p>' +
    ETAPAS_DISPONIVEIS.map(function (e) {
      var marcada = estado.pactuadas.indexOf(e.id) !== -1 ? " checked" : "";
      return '<label class="opcao"><input type="checkbox" value="' + e.id + '"' + marcada +
        '><span class="texto">' + e.nome + '<small>' + e.detalhe + '</small></span></label>';
    }).join("") +
    '<span class="erro" id="erro-pactuadas" hidden></span>' +
    '<div class="navegacao"><button class="primario" id="btn-avancar">Continuar</button></div>';

  document.getElementById("btn-avancar").onclick = function () {
    var marcadas = Array.prototype.slice
      .call(palco.querySelectorAll('input[type="checkbox"]:checked'))
      .map(function (i) { return i.value; });

    var erro = document.getElementById("erro-pactuadas");
    if (marcadas.length === 0) {
      erro.textContent = "Selecione ao menos uma etapa. Escola sem meta pactuada não é elegível ao BDE.";
      erro.hidden = false;
      return;
    }

    // Preserva a ordem canônica das etapas, não a ordem dos cliques.
    estado.pactuadas = ETAPAS_DISPONIVEIS
      .map(function (e) { return e.id; })
      .filter(function (id) { return marcadas.indexOf(id) !== -1; });
    avancar();
  };
}

/* ---------- Telas 2..n: uma por etapa ---------- */

function telaEtapa(id) {
  var etapa = ETAPAS_DISPONIVEIS.find(function (e) { return e.id === id; });
  var salvo = estado.dados[id] || {};

  palco.innerHTML =
    '<h2>' + etapa.nome + '</h2>' +
    '<p class="ajuda">Números do <strong>IDEPE/SAEPE</strong> — não do IDEB/SAEB. ' +
    'Os dois índices têm a mesma ordem de grandeza e trocá-los produz um resultado ' +
    'errado sem nenhum sinal.</p>' +

    '<div class="campo" id="campo-matriculas">' +
      '<label for="matriculas">Matrículas de 2025</label>' +
      '<span class="dica">Peso desta etapa na média ponderada. Fonte: Censo Escolar 2025 — ' +
      'não use as matrículas do ano corrente.</span>' +
      '<input type="text" id="matriculas" inputmode="numeric" placeholder="ex.: 320" value="' +
      (salvo.matriculas != null ? salvo.matriculas : "") + '">' +
      '<span class="erro" hidden></span>' +
    '</div>' +

    '<div class="dupla">' +
      '<div class="campo" id="campo-meta">' +
        '<label for="meta">Meta IDEPE 2025</label>' +
        '<span class="dica">Pactuada no Termo de Compromisso.</span>' +
        '<input type="text" id="meta" inputmode="decimal" placeholder="ex.: 4,5" value="' +
        (salvo.meta != null ? numero(salvo.meta, 2) : "") + '">' +
        '<span class="erro" hidden></span>' +
      '</div>' +
      '<div class="campo" id="campo-resultado">' +
        '<label for="resultado">IDEPE 2025 obtido</label>' +
        '<span class="dica">Resultado divulgado para a escola.</span>' +
        '<input type="text" id="resultado" inputmode="decimal" placeholder="ex.: 4,7" value="' +
        (salvo.resultado != null ? numero(salvo.resultado, 2) : "") + '">' +
        '<span class="erro" hidden></span>' +
      '</div>' +
    '</div>' +

    '<div class="previa" id="previa">Informe meta e resultado para ver a diferença.</div>' +

    '<div class="navegacao">' +
      '<button class="secundario" id="btn-voltar">Voltar</button>' +
      '<button class="primario" id="btn-avancar">Continuar</button>' +
    '</div>';

  // A prévia ao vivo é o que denuncia meta e resultado digitados trocados:
  // ambos são IDEPEs plausíveis e nenhuma validação de faixa pega a inversão.
  function atualizarPrevia() {
    var previa = document.getElementById("previa");
    var meta = lerDecimal(document.getElementById("meta").value);
    var resultado = lerDecimal(document.getElementById("resultado").value);

    previa.className = "previa";
    if (meta === null || resultado === null) {
      previa.textContent = "Informe meta e resultado para ver a diferença.";
      return;
    }

    var diferenca = arredondarExcel(resultado - meta);
    previa.className = "previa " + (diferenca >= 0 ? "acima" : "abaixo");
    previa.innerHTML = "Seu resultado ficou <strong>" +
      numero(Math.abs(diferenca), 2) + " ponto(s) " +
      (diferenca >= 0 ? "acima" : "abaixo") + "</strong> da meta " +
      "(diferença " + comSinal(diferenca, 4) + ").";
  }

  ["meta", "resultado"].forEach(function (campo) {
    document.getElementById(campo).addEventListener("input", atualizarPrevia);
  });
  atualizarPrevia();

  document.getElementById("btn-voltar").onclick = voltar;
  document.getElementById("btn-avancar").onclick = function () {
    var matriculas = validarCampo("matriculas", lerInteiro, MATRICULAS_MIN, MATRICULAS_MAX,
      "Informe as matrículas de 2025, entre " + MATRICULAS_MIN + " e " +
      MATRICULAS_MAX.toLocaleString("pt-BR") + ".");
    var meta = validarCampo("meta", lerDecimal, IDEPE_MIN, IDEPE_MAX,
      "A meta IDEPE deve estar entre " + numero(IDEPE_MIN, 1) + " e " + numero(IDEPE_MAX, 1) + ".");
    var resultado = validarCampo("resultado", lerDecimal, IDEPE_MIN, IDEPE_MAX,
      "O IDEPE obtido deve estar entre " + numero(IDEPE_MIN, 1) + " e " + numero(IDEPE_MAX, 1) + ".");

    if (matriculas === null || meta === null || resultado === null) return;

    estado.dados[id] = { matriculas: matriculas, meta: meta, resultado: resultado };
    avancar();
  };
}

/** Valida um campo e pinta o erro na própria tela. Devolve null se inválido. */
function validarCampo(id, leitor, minimo, maximo, mensagem) {
  var campo = document.getElementById("campo-" + id);
  var erro = campo.querySelector(".erro");
  var valor = leitor(document.getElementById(id).value);

  if (valor === null || valor < minimo || valor > maximo) {
    campo.classList.add("invalido");
    erro.textContent = mensagem;
    erro.hidden = false;
    return null;
  }

  campo.classList.remove("invalido");
  erro.hidden = true;
  return valor;
}

/* ---------- Tela n+1: equidade e participação ---------- */

var PERGUNTAS_FINAIS = [
  {
    chave: "reduziuDesigualdade",
    titulo: "Redução de desigualdade (D12)",
    texto: "Houve evolução, no SAEPE 2025, dos estudantes Pretos, Pardos e Indígenas " +
      "e daqueles de nível socioeconômico mais baixo, em comparação com 2024?",
    fonte: "Consultar o BI da Equidade."
  },
  {
    chave: "tercoMenorElementares",
    titulo: "1º terço de elementares (D13)",
    texto: "Na Macrorregião, comparando com escolas do mesmo tipo, a escola está no " +
      "1º terço (33,3%) com menor percentual de estudantes nos níveis elementares no SAEPE 2025?",
    fonte: "Consultar o BI do SAEPE, versão GRE."
  },
  {
    chave: "participacaoMinimaAtingida",
    titulo: "Participação mínima",
    texto: "A escola atingiu participação de 80% ou mais em TODOS os componentes e " +
      "etapas avaliados no SAEPE?",
    fonte: "A exigência é por componente e por etapa — uma média geral de 80% não basta."
  }
];

function telaEquidade() {
  palco.innerHTML =
    '<h2>Equidade e participação</h2>' +
    '<p class="ajuda">Três respostas de sim ou não. Juntas, valem até 150 pontos ' +
    'percentuais da cota do BDE.</p>' +
    PERGUNTAS_FINAIS.map(function (p) {
      var valor = estado[p.chave];
      return '<fieldset style="border:0;padding:0;margin:0 0 18px">' +
        '<legend style="font-size:0.875rem;font-weight:600;padding:0;margin-bottom:6px">' +
        p.titulo + '</legend>' +
        '<p class="ajuda" style="margin-bottom:10px">' + p.texto +
        ' <em>' + p.fonte + '</em></p>' +
        '<label class="opcao"><input type="radio" name="' + p.chave + '" value="sim"' +
        (valor === true ? " checked" : "") + '><span class="texto">Sim</span></label>' +
        '<label class="opcao"><input type="radio" name="' + p.chave + '" value="nao"' +
        (valor === false ? " checked" : "") + '><span class="texto">Não</span></label>' +
        '</fieldset>';
    }).join("") +
    '<span class="erro" id="erro-equidade" hidden></span>' +
    '<div class="navegacao">' +
      '<button class="secundario" id="btn-voltar">Voltar</button>' +
      '<button class="primario" id="btn-avancar">Calcular o BDE</button>' +
    '</div>';

  document.getElementById("btn-voltar").onclick = voltar;
  document.getElementById("btn-avancar").onclick = function () {
    var erro = document.getElementById("erro-equidade");
    var pendente = PERGUNTAS_FINAIS.find(function (p) {
      return !palco.querySelector('input[name="' + p.chave + '"]:checked');
    });

    if (pendente) {
      erro.textContent = "Responda todas as três perguntas antes de calcular.";
      erro.hidden = false;
      return;
    }

    PERGUNTAS_FINAIS.forEach(function (p) {
      estado[p.chave] = palco.querySelector('input[name="' + p.chave + '"]:checked').value === "sim";
    });
    avancar();
  };
}

/* ---------- Tela final: resultado ---------- */

function telaResultado() {
  var resposta = calcularBde({
    etapas: estado.pactuadas.map(function (id) {
      var etapa = ETAPAS_DISPONIVEIS.find(function (e) { return e.id === id; });
      var d = estado.dados[id];
      return {
        etapa: id,
        nome: etapa.nome,
        matriculas: d.matriculas,
        meta: d.meta,
        resultado: d.resultado
      };
    }),
    reduziuDesigualdade: estado.reduziuDesigualdade,
    tercoMenorElementares: estado.tercoMenorElementares,
    participacaoMinimaAtingida: estado.participacaoMinimaAtingida
  });

  var alemForaDoTotal = resposta.cotaAlemResultado > 0 && resposta.percentualBde !== 2.5 + resposta.cotaParticipacao;

  palco.innerHTML =
    '<div class="placar' + (resposta.aptoAReceber ? "" : " inapto") + '">' +
      '<div class="valor">' + resposta.percentualFormatado + '</div>' +
      '<div class="legenda">' +
        (resposta.aptoAReceber
          ? "da cota do BDE — teto de 300%"
          : "a escola não faz jus a cota do BDE nesta simulação") +
      '</div>' +
    '</div>' +

    '<div class="bloco">' +
      '<h3>Composição da cota</h3>' +
      '<table class="cotas">' +
        linhaCota("Média ponderada das diferenças (H47)", comSinal(resposta.mediaPonderadaDiferenca, 4)) +
        linhaCota("Atingimento do IDEPE (H45)", percentual(resposta.percentualIdepe)) +
        linhaCota("Cota de resultado (B40)", percentual(resposta.cotaResultado)) +
        linhaCota("Cota além do resultado (B41)", percentual(resposta.cotaAlemResultado), alemForaDoTotal) +
        linhaCota("Cota de equidade (B42)", percentual(resposta.cotaEquidade)) +
        linhaCota("Cota de elementares (B43)", percentual(resposta.cotaElementares)) +
        linhaCota("Cota de participação (B44)", percentual(resposta.cotaParticipacao)) +
      '</table>' +
    '</div>' +

    (resposta.alertas.length > 0
      ? '<div class="bloco"><h3>O que muda o seu resultado</h3>' +
        resposta.alertas.map(function (a) { return '<div class="alerta">' + a + '</div>'; }).join("") +
        '</div>'
      : "") +

    '<div class="bloco">' +
      '<h3>Memória de cálculo</h3>' +
      '<ul class="memoria">' +
        resposta.memoriaCalculo.map(function (m) { return "<li>" + m + "</li>"; }).join("") +
      '</ul>' +
    '</div>' +

    '<p class="aviso-legal">' + resposta.avisoLegal + '</p>' +

    '<div class="navegacao">' +
      '<button class="secundario" id="btn-voltar">Voltar</button>' +
      '<button class="primario" id="btn-recomecar">Nova simulação</button>' +
    '</div>';

  document.getElementById("btn-voltar").onclick = voltar;
  document.getElementById("btn-recomecar").onclick = function () {
    estado = {
      passo: 0,
      pactuadas: [],
      dados: {},
      reduziuDesigualdade: null,
      tercoMenorElementares: null,
      participacaoMinimaAtingida: null
    };
    renderizar();
  };
}

function linhaCota(rotulo, valor, fraca) {
  var classe = fraca ? ' class="celula-fraca"' : "";
  return "<tr><td" + classe + ">" + rotulo +
    (fraca ? " <small>(não entra no total)</small>" : "") +
    "</td><td" + classe + ">" + valor + "</td></tr>";
}

renderizar();
</script>
</body>
</html>
